<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="ChatGPT Duo Skin dual avatar theme illustration">
<defs>
 <linearGradient id="stage" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#090F25"/><stop offset=".6" stop-color="#192D52"/><stop offset="1" stop-color="#241D49"/></linearGradient>
 <linearGradient id="left" x1="0" x2="1"><stop stop-color="#203350"/><stop offset=".48" stop-color="#597794"/><stop offset="1" stop-color="#EAF4FA"/></linearGradient>
 <linearGradient id="right" x1="0" x2="1"><stop stop-color="#E65398"/><stop offset=".6" stop-color="#F58CBD"/><stop offset="1" stop-color="#FEEDF5"/></linearGradient>
 <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152B4D"/><stop offset="1" stop-color="#44374F"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#000" flood-opacity=".2"/></filter>
</defs>
<rect width="1200" height="700" fill="url(#stage)"/>
<g opacity=".22" fill="none" stroke="#BAC7FF"><circle cx="1100" cy="80" r="180"/><circle cx="1100" cy="80" r="135"/><circle cx="1100" cy="80" r="90"/></g>
<rect x="0" y="0" width="246" height="700" fill="#091022" opacity=".94"/>
