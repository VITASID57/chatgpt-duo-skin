<text x="461" y="219" font-family="Arial,sans-serif" font-size="16" fill="#CEDBF8">MESSAGE ARCHIVE · conversation snapshot</text>
<rect x="461" y="244" width="220" height="27" rx="12" fill="#26456E"/>
<text x="480" y="263" font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="13" fill="#DCE9FF">✨ 2026 / 10 / 10 · 主题时间</text>
