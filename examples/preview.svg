<g font-family="Arial,Noto Sans CJK SC,sans-serif" fill="#ADBED8" font-size="18"><text x="30" y="135">＋ 新聊天</text><text x="30" y="206">最近的对话</text><text x="48" y="257">小小主题实验</text><text x="48" y="302">我们的创作笔记</text></g>
